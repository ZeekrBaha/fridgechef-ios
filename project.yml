name: FridgeChef
options:
  bundleIdPrefix: com.baha
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  FridgeChef:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FridgeChef
        excludes:
          - "DesignSystem/Fonts/**"
      - path: FridgeChef/DesignSystem/Fonts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.fridgechef
        INFOPLIST_FILE: FridgeChef/App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
    postBuildScripts:
      - name: Inject OPENAI_API_KEY
        script: bash "$SRCROOT/scripts/inject-openai-key.sh"
        runOnlyWhenInstalling: false

  FridgeChefTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FridgeChefTests
    dependencies:
      - target: FridgeChef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.fridgechef.tests
        GENERATE_INFOPLIST_FILE: YES

  FridgeChefUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FridgeChefUITests
    dependencies:
      - target: FridgeChef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baha.fridgechef.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FridgeChef:
    build:
      targets:
        FridgeChef: all
        FridgeChefTests: [test]
        FridgeChefUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FridgeChefTests
        - FridgeChefUITests
